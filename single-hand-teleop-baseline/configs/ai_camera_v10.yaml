# 当前摄像头映射入口 v10；完整展平配置，不继承首轮中间文件。
# R1：AI 滤波关闭，设备限速由 DS 适配层处理；下列滤波频率/系数在 none 模式不生效。
# R2：拇指指尖参考 0.98/0.60、权重 0.25，抓握引导按 0.10/0.65 端点重定。
# 仍为单右手九通道配比代理；抓握拇指限制 0.85/0.75，捏合不套此上限。
camera_index: 0
input_source_type: webcam
video_file_path: ''
input_mirrored: false
gui_enabled: true
headless: false
display_width: 1280
display_height: 720
draw_landmarks: true
console_print_every_n_frames: 5
console_landmarks_preview_count: 3
save_last_json: true
save_jsonl: false
jsonl_output_dir: outputs
output_json_path: outputs/latest_ai_camera_v10_frame.json
export_last_every_n_frames: 5
jsonl_flush_interval: 10
unity_udp_enabled: false
unity_udp_host: 127.0.0.1
unity_udp_port: 18080
prediction_shadow_enabled: false
prediction_shadow_model_path: models/residual_motion4.json
prediction_shadow_device: auto
prediction_shadow_max_frame_gap_ms: 100.0
prediction_shadow_output_json_path: outputs/latest_prediction_shadow.json
prediction_shadow_jsonl_output_dir: outputs
prediction_shadow_result_queue_size: 8
prediction_shadow_worker_shutdown_timeout_s: 2.0
enable_control_extension: true
control_grasp_open_ref: 0.02
control_grasp_closed_ref: 0.9
control_pinch_open_ref: 0.45
control_pinch_closed_ref: 0.08
control_hand_open_ratio_open_ref: 0.95
control_hand_open_ratio_closed_ref: 0.25
control_pinch_index_open_ref: 0.05
control_pinch_index_closed_ref: 0.35
control_open_release_enabled: false
control_open_release_start_ratio: 0.85
control_open_release_full_ratio: 0.95
svh_enable_preview: true
svh_enable_gesture_fallback: false
svh_preview_layout: svh_9ch
svh_preview_channel_count: 9
svh_preview_mode: preview
svh_grasp_open_ref: 0.02
svh_grasp_closed_ref: 0.55
svh_pinch_open_ref: 0.45
svh_pinch_closed_ref: 0.08
svh_hand_open_ratio_open_ref: 0.95
svh_hand_open_ratio_closed_ref: 0.25
svh_position_open_value: 0.0
svh_position_closed_value: 1.0
svh_thumb_grasp_scale: 0.85
svh_thumb_opposition_scale: 0.75
svh_pinch_support_scale: 0.2
svh_open_spread_scale: 0.25
svh_grasp_spread_scale: 0.05
svh_pinch_spread_scale: 0.1
svh_pinch_index_open_ref: 0.05
svh_pinch_index_closed_ref: 0.35
control_ready_min_in_bounds_ratio: 0.9
control_ready_palm_center_margin: 0.08
control_ready_palm_core_oob_tolerance: 0.02
pinch_distance_norm_threshold: 0.45
pinch_open_ratio_min: 0.75
pinch_support_curl_max: 0.65
open_ratio_threshold: 0.85
open_mean_curl_max: 0.45
fist_ratio_threshold: 0.85
fist_mean_curl_min: 0.45
fist_compact_ratio_threshold: 0.65
stable_gesture_window: 5
stable_gesture_min_consecutive: 2
stable_unknown_consecutive: 1
min_detection_confidence: 0.5
min_tracking_confidence: 0.5
max_num_hands: 2
geometry_mode: image_width_xyz_v1
control_open_release_mode: none
svh_9ch_open_ticks:
- -5000
- -5000
- -2000
- 2000
- -2000
- 2000
- -2000
- -2000
- -2000
svh_9ch_closed_ticks:
- -175000
- -150000
- -47000
- 42000
- -47000
- 42000
- -47000
- -47000
- -47000
geometry_min_palm_size: 0.0001
geometry_min_bone_palm_ratio: 0.001
control_release_curl_half_width: 0.02
control_release_pinch_band: 0.1
control_release_hysteresis: 0.01
mapping_max_frame_gap_ms: 100.0
mapping_frame_gap_period_factor: 2.5
mapping_frame_gap_period_window: 9
mapping_frame_gap_ceiling_ms: 1000.0
camera_mapping_stage: 10
feature_curl_mode: per_finger_tip_v1
finger_tip_open_refs:
  thumb: 0.98
  index: 1.17
  middle: 1.22
  ring: 1.16
  little: 1.05
finger_tip_closed_refs:
  thumb: 0.6
  index: 0.77
  middle: 0.72
  ring: 0.58
  little: 0.42
pinch_distance_mode: max_2d_geometry3d_v1
svh_mapping_transition_mode: continuous_blend_v1
svh_pinch_blend_start: 0.2
svh_pinch_blend_full: 0.6
control_finger_range_mode: long_finger_v1
control_finger_open_refs:
  index: 0.02
  middle: 0.02
  ring: 0.02
  little: 0.02
control_finger_closed_refs:
  index: 0.78
  middle: 0.8
  ring: 0.8
  little: 0.8
control_grasp_flex_weight: 1.0
control_flex_filter_mode: none
control_flex_filter_min_cutoff_hz: 2.0
control_flex_filter_beta: 0.1
control_flex_filter_derivative_cutoff_hz: 1.0
thumb_tip_proximity_weight: 0.25
svh_thumb_control_mode: calibrated_grasp_v1
svh_thumb_grasp_open_ref: 0.1
svh_thumb_grasp_closed_ref: 0.65
svh_thumb_grasp_guide_weight: 0.95
