project:
  name: freihand_eval
  default_split: evaluation

annotations:
  training:
    K: ../../../dataset/training_K.json
    xyz: ../../../dataset/training_xyz.json
    scale: ../../../dataset/training_scale.json
    image_root: ../../../dataset/training/rgb
  evaluation:
    K: ../../../dataset/evaluation_K.json
    xyz: ../../../dataset/evaluation_xyz.json
    scale: ../../../dataset/evaluation_scale.json
    image_root: ../../../dataset/evaluation/rgb

paths:
  prediction_json: ../examples/sample_prediction.json
  current_pipeline_prediction_json: ../outputs/current_pipeline_predictions.json
  annotation_inspection_report: ../reports/annotation_inspection.md
  projected_2d_keypoints_json: ../outputs/freihand_2d_keypoints.json
  eval_metrics_json: ../reports/eval_metrics.json
  eval_report_md: ../reports/eval_report.md
  ppt_table_md: ../reports/ppt_report_table.md

projection:
  z_epsilon: 1.0e-8

metrics:
  pck_2d_thresholds_px: [5, 10, 20, 30]
  joint_count: 21

runtime:
  max_samples:

current_pipeline:
  # FreiHAND 评估关注单手关键点检测能力，不按项目运行期的“只控右手”策略扣分。
  prefer_any_hand: true
  input_mirrored: false
  static_image_mode: true
  image_extension: .jpg
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  max_num_hands: 2
