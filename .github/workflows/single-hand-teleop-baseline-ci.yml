name: HandAi AI 检查

"on":
  push:
    branches:
      - main
    paths:
      - "single-hand-teleop-baseline/**"
      - ".github/workflows/single-hand-teleop-baseline-ci.yml"
      - "LICENSE"
  pull_request:
    paths:
      - "single-hand-teleop-baseline/**"
      - ".github/workflows/single-hand-teleop-baseline-ci.yml"
      - "LICENSE"

env:
  # Windows Git Bash 默认编码无法稳定输出中文 CLI 帮助；同时传给 pytest 子进程。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  prediction-cpu:
    name: 可重建预测检查 (Linux CPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: single-hand-teleop-baseline
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: single-hand-teleop-baseline/requirements.txt
      - name: 安装 CPU PyTorch 与运行依赖
        run: |
          python -m pip install -r requirements.txt
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip check
          python -c "import torch; assert not torch.cuda.is_available(); print('CPU torch:', torch.__version__)"
      - name: M1/M2 训练、掩码、导出与重载
        run: |
          python -m pytest -q tests/test_keypoint_prediction.py tests/test_representation_comparison.py --junitxml=outputs/cpu-prediction.xml
          python -c "import xml.etree.ElementTree as E; r=E.parse('outputs/cpu-prediction.xml').getroot(); s=list(r.iter('testsuite')); assert sum(int(x.get('tests',0)) for x in s)>0; assert sum(int(x.get('skipped',0)) for x in s)==0, 'CPU 预测测试不允许跳过'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-prediction-results
          path: single-hand-teleop-baseline/outputs/cpu-prediction.xml
  baseline-ci:
    name: baseline 检查 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    defaults:
      run:
        working-directory: single-hand-teleop-baseline
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            single-hand-teleop-baseline/requirements.txt
            single-hand-teleop-baseline/pyproject.toml

      - name: 安装运行与测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 安装 CI 必需工具
        run: |
          python -m pip install ruff

      - name: 安装 pip-audit（仅告警）
        continue-on-error: true
        run: |
          python -m pip install pip-audit

      - name: 检查已安装依赖
        run: |
          python -m pip check

      - name: 运行 Ruff 检查
        run: |
          python -m ruff check src tests scripts experiments examples/use_ai_api.py

      - name: 编译源码
        run: |
          python -m compileall -q src scripts experiments

      - name: 运行测试
        shell: bash
        run: |
          mkdir -p ../ci-artifacts
          set -o pipefail
          pytest -q 2>&1 | tee ../ci-artifacts/pytest.log

      - name: 失败时上传诊断信息
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: single-hand-baseline-diagnostics-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            ci-artifacts/**
            single-hand-teleop-baseline/outputs/**
            single-hand-teleop-baseline/examples/*.json
            single-hand-teleop-baseline/examples/*.jsonl

      - name: 运行 pip-audit（仅告警）
        continue-on-error: true
        run: |
          python -m pip_audit -r requirements.txt
